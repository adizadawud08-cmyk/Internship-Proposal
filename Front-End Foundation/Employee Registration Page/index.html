<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Registration</title>
</head>
<body>
  <header>
    <h2>
      Employee Registration
    </h2>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Employees</a>
    <a href="#">About</a>
  </nav>

  <main>
     
    <h2 class="h2">
      Employee Registration
    </h2>
   <p class="p">Fill in the form below to register a new employee</p>
    
    <form action="">
    
        <label for="text">Full Name:</label>
        <input type="text" id="name"required placeholder="enter your name">
      
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="enter your email" required>

        <label for="department">Department:</label>
        <select id="department" name="department">
          <option>Select Department</option>
          <option value="it">IT</option>
          <option value="HR">HR</option>
          <option value="finance">Finance</option>
          <option value="marketing">Marketing</option>
        </select>

       <section class="rid">
        <h3>Gender:</h3>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="Female" name="gender" value="female">
        <label for="female">Female</label>
        
        <input type="radio" for="other">
        <label for="other"  id="Other" name="gender" value="other">Other</label><br><br>

      <h3>Skills:</h3>
        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>
        <input type="checkbox" id="javascript" name="skills" value="javascript">
        <label for="javascript">javascript</label><br><br>
       </section>
      
          <label for="profile">Profile:</label>
          <input type="file" id="profile" name="profile" value="profile"><br><br>
          
        <label for="bio">Bio:</label>
        <textarea id="bio" name="bio"></textarea>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button> 
    </form>

    <table>
     <thead>
       <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
      </tr>
     </thead>
      <tbody>
        <tr>
        <td>Aisha</td>
        <td>adiza@email.com</td>
        <td>IT</td>
      </tr>
      <tr>
        <td>Dawud</td>
        <td>ibrahim@email.com</td>
        <td>HR</td>
      </tr>
      </tbody>
    </table>
  </main>
  <footer>
    <p>&copy; 2026 Employee Registration</p>
  </footer>
</body>
</html>
